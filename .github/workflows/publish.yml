# Releases each mod whose mod.ini gives a version that has no release yet, then rebuilds the site
# on GitHub Pages. To release a mod, raise the Version in its mod.ini and push to main: the mod is
# packed into <mod>.hog with sltool, with <mod>.hog.sha256 beside it, and published as the release
# <mod>-v<version> with both attached. The site lists every mod by category with its latest
# download, and every release on its updates page.
name: Publish

on:
  push:
    branches: [main]
  # Once a day, the site alone, so that a mod waiting for a newer OpenReliant shows as ready once
  # that version is out, and the mods' download counts are never more than a day old.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # The tags, to tell which versions are released and what changed since the last.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get the mods kept in other repositories
        uses: ./.github/actions/external
      - name: Get sltool
        uses: ./.github/actions/sltool
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py

  pages:
    needs: release
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get the thumbnails of the mods kept in other repositories
        uses: ./.github/actions/external
        with:
          files: thumbnails
      - run: python3 .github/scripts/site.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
