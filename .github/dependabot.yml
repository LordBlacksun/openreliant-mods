# Opens a pull request that moves an artist's submodule under external/ to their latest commit,
# each day they have new commits. The Check workflow checks it, and once it passes, the
# Dependabot workflow merges it and publishes.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    # Every day at 06:00 UTC, weekends included: Dependabot's daily interval only runs on
    # weekdays, and artists often publish at the weekend.
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
    commit-message:
      prefix: chore
